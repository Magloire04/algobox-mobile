name: Qualité

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    name: Linter, formatage et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  parcours-critiques:
    name: Tests de bout en bout
    runs-on: ubuntu-latest
    needs: verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
