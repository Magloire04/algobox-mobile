<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AlgoBox Mobile</title>
    <meta name="description" content="Éditeur et testeur d'algorithmes compatible AlgoBox, installable sur téléphone et utilisable hors ligne." />
    <meta name="theme-color" content="#3a6ea5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AlgoBox" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="app-icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="app-icons/icon-192.png" />
    <link rel="apple-touch-icon" href="app-icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="app-bar">
        <button class="icon-button" id="menuButton" type="button" aria-label="Ouvrir le menu" aria-haspopup="true">☰</button>
        <div class="app-bar__title">
          <span class="app-bar__name">AlgoBox</span>
          <span class="app-bar__file" id="fileNameLabel">sanstitre</span>
        </div>
        <button class="test-launch" id="testButton" type="button">▶ Tester</button>
      </header>

      <nav class="view-switch" role="tablist" aria-label="Affichage">
        <button class="view-switch__button" type="button" role="tab" id="algorithmViewTab" aria-selected="true" aria-controls="algorithmView">
          Algorithme
        </button>
        <button class="view-switch__button" type="button" role="tab" id="presentationViewTab" aria-selected="false" aria-controls="presentationView">
          Présentation
        </button>
      </nav>

      <main class="workspace" id="algorithmView" role="tabpanel" aria-labelledby="algorithmViewTab">
        <div class="tree" id="treeView" role="tree" aria-label="Arbre de l'algorithme"></div>

        <div class="text-editor" id="textEditor" hidden>
          <div class="text-editor__gutter" id="textEditorGutter" aria-hidden="true">1</div>
          <textarea
            class="text-editor__input"
            id="textEditorInput"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            aria-label="Code de l'algorithme"
          ></textarea>
        </div>
        <div class="status-message" id="textEditorStatus" role="status" hidden></div>

        <div class="line-actions" id="lineActions" role="toolbar" aria-label="Lignes">
          <button class="action-button action-button--primary" type="button" id="newLineButton">+ Nouvelle ligne</button>
          <button class="action-button" type="button" id="editLineButton">Modifier ligne</button>
          <button class="action-button action-button--danger" type="button" id="deleteLineButton">Supprimer ligne/bloc</button>
          <button class="action-button" type="button" id="copyLineButton">Copier</button>
          <button class="action-button" type="button" id="cutLineButton">Couper</button>
          <button class="action-button" type="button" id="pasteLineButton">Coller</button>
        </div>
        <div class="line-actions" id="textActions" role="toolbar" aria-label="Code" hidden>
          <button class="action-button action-button--primary" type="button" id="checkCodeButton">Vérifier code</button>
          <button class="action-button" type="button" id="nextFieldButton">Champ • suivant</button>
          <button class="action-button" type="button" id="normalModeButton">Revenir au mode normal</button>
        </div>

        <section class="operations" id="operationsPanel" aria-label="Opérations">
          <div class="operations__tabs" role="tablist" id="operationsTabs"></div>
          <div class="operations__content" id="operationsContent"></div>
        </section>
      </main>

      <section class="presentation" id="presentationView" role="tabpanel" aria-labelledby="presentationViewTab" hidden>
        <div class="field">
          <label class="field__label" for="descriptionInput">À propos de cet algorithme :</label>
          <textarea id="descriptionInput" rows="6"></textarea>
        </div>
        <p class="field__label">Paramètres de cet algorithme :</p>
        <ul class="parameter-list" id="parameterList"></ul>
        <button class="action-button" type="button" id="changeSettingsButton">Changer</button>
        <p class="operation-hint presentation__extension">Extension utilisée : aucune</p>
      </section>
    </div>

    <section class="test-window" id="testWindow" role="dialog" aria-modal="true" aria-labelledby="testWindowTitle" hidden>
      <header class="test-window__header">
        <h1 class="test-window__title" id="testWindowTitle">AlgoBox Test</h1>
        <button class="icon-button" type="button" id="printTestButton" aria-label="Imprimer les résultats">⎙</button>
        <button class="icon-button" type="button" id="closeTestButton" aria-label="Fermer la fenêtre de test">✕</button>
      </header>
      <div class="test-window__body" id="testWindowBody">
        <div class="panel" id="descriptionPanel" hidden>
          <div class="panel__content algorithm-description" id="descriptionText"></div>
        </div>
        <div class="panel">
          <h2 class="panel__title">Résultats</h2>
          <div class="console" id="console" aria-live="polite"></div>
        </div>
        <div class="panel" id="graphPanel" hidden>
          <h2 class="panel__title">Graphique</h2>
          <div class="panel__content">
            <div class="graph" id="graph">
              <canvas id="frameCanvas" aria-hidden="true"></canvas>
              <canvas id="drawingCanvas" role="img" aria-label="Graphique tracé par l'algorithme"></canvas>
            </div>
            <p class="graph-legend" id="graphLegend"></p>
          </div>
        </div>
        <div class="panel" id="stepPanel" hidden>
          <h2 class="panel__title">Suivi pas à pas</h2>
          <div class="step-trace" id="stepTrace"></div>
        </div>
        <div class="panel">
          <h2 class="panel__title">Code de l'algorithme</h2>
          <div class="code-listing" id="codeListing"></div>
        </div>
      </div>
      <div class="test-window__controls">
        <div class="current-line" id="currentLineBanner" role="status" hidden></div>
        <label class="check-field"><input type="checkbox" id="stepModeCheckbox" /> Mode pas à pas</label>
        <span class="running-indicator" id="runningIndicator" hidden>Exécution…</span>
        <button class="action-button action-button--primary" type="button" id="runButton">Lancer Algorithme</button>
        <button class="action-button" type="button" id="continueButton" disabled>Continuer</button>
        <button class="action-button action-button--danger" type="button" id="stopButton" disabled>Arrêter</button>
      </div>
    </section>

    <div id="overlayRoot"></div>

    <script src="js/algoEngine.js"></script>
    <script src="js/exampleLibrary.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
